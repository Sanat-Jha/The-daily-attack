{% extends 'base.html' %}

{% block title %}Login - The Daily Attack{% endblock %}

{% block content %}
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-6">Login</h1>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}
            
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" id="id_username" class="w-full px-3 py-2 border rounded" required>
            </div>
            
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" id="id_password" class="w-full px-3 py-2 border rounded" required>
            </div>
            
            <div>
                <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Login</button>
            </div>
        </form>
        
        <div class="mt-4 text-center">
            <p>Don't have an account? <a href="{% url 'signup' %}" class="text-blue-600 hover:underline">Sign up</a></p>
        </div>
    </div>
{% endblock %}
